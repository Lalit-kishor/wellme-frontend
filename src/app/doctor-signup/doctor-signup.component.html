<div class="doctor-signup-container">
  <div class="doctor-signup-card">
    <h2>Doctor Registration</h2>
    <p class="subtitle">Join our healthcare network</p>

    <div class="stepper">
      <button
        type="button"
        class="step-item"
        *ngFor="let title of stepTitles; let index = index"
        [class.active]="currentStep === index + 1"
        [class.completed]="index + 1 < currentStep"
        [disabled]="!isStepAccessible(index + 1)"
        (click)="goToStep(index + 1)"
      >
        <span class="step-index">{{ index + 1 }}</span>
        <span class="step-text">{{ title }}</span>
      </button>
    </div>

    <div class="section-title">{{ currentStepTitle }}</div>
    
    <form (ngSubmit)="onSubmit()" #doctorSignupForm="ngForm">
      <!-- Step 1: Personal Information -->
      <ng-container *ngIf="currentStep === 1">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name *</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              [(ngModel)]="firstName"
              required
              placeholder="Enter first name"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              [(ngModel)]="lastName"
              required
              placeholder="Enter last name"
              class="form-control"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            placeholder="Enter your email"
            class="form-control"
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="gender">Gender *</label>
            <select
              id="gender"
              name="gender"
              [(ngModel)]="gender"
              required
              class="form-control"
            >
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="languages">Languages *</label>
            <input
              type="text"
              id="languages"
              name="languages"
              [(ngModel)]="languages"
              required
              placeholder="e.g., English, Spanish"
              class="form-control"
            />
          </div>
        </div>
      </ng-container>

      <!-- Step 2: Professional Information -->
      <ng-container *ngIf="currentStep === 2">
        <div class="form-group">
          <label for="medicalLicenseNumber">Medical License Number *</label>
          <input
            type="text"
            id="medicalLicenseNumber"
            name="medicalLicenseNumber"
            [(ngModel)]="medicalLicenseNumber"
            required
            placeholder="Enter license number"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="specializations">Specializations *</label>
          <input
            type="text"
            id="specializations"
            name="specializations"
            [(ngModel)]="specializations"
            required
            placeholder="e.g., Cardiology, Pediatrics"
            class="form-control"
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="yearsOfExperience">Years of Experience</label>
            <input
              type="number"
              id="yearsOfExperience"
              name="yearsOfExperience"
              [(ngModel)]="yearsOfExperience"
              min="0"
              placeholder="0"
              class="form-control"
            />
          </div>

          <div class="form-group">
            <label for="consultationFee">Consultation Fee ($)</label>
            <input
              type="number"
              id="consultationFee"
              name="consultationFee"
              [(ngModel)]="consultationFee"
              min="0"
              placeholder="0"
              class="form-control"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="clinicAddress">Clinic Address *</label>
          <textarea
            id="clinicAddress"
            name="clinicAddress"
            [(ngModel)]="clinicAddress"
            required
            placeholder="Enter complete clinic address"
            class="form-control"
            rows="3"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="city">City *</label>
          <input
            type="text"
            id="city"
            name="city"
            [(ngModel)]="city"
            required
            placeholder="Enter City"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="profilePicture">Profile Picture</label>
          <input
            type="file"
            id="profilePicture"
            name="profilePicture"
            (change)="onFileSelect($event)"
            accept="image/*"
            class="form-control-file"
          />
          <div class="image-preview" *ngIf="profilePicturePreview">
            <img [src]="profilePicturePreview" alt="Profile Preview" />
          </div>
        </div>
      </ng-container>

      <!-- Step 3: Account Security -->
      <ng-container *ngIf="currentStep === 3">
        <div class="form-group">
          <label for="password">Password *</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            required
            minlength="6"
            placeholder="Enter password (min 6 characters)"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="password_repeat">Confirm Password *</label>
          <input
            type="password"
            id="password_repeat"
            name="password_repeat"
            [(ngModel)]="password_repeat"
            required
            placeholder="Confirm your password"
            class="form-control"
          />
        </div>
      </ng-container>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="step-actions">
        <button type="button" class="btn-secondary" *ngIf="currentStep > 1" (click)="goToPreviousStep()">
          Back
        </button>

        <button type="button" class="btn-primary" *ngIf="currentStep < totalSteps" (click)="goToNextStep()">
          Next
        </button>

        <button type="submit" class="btn-primary" *ngIf="currentStep === totalSteps" [disabled]="isLoading">
          {{ isLoading ? 'Registering...' : 'Register as Doctor' }}
        </button>
      </div>
    </form>

    <div class="login-link">
      <p>Already have an account? <a routerLink="/login">Login</a></p>
      <p>Not a doctor? <a routerLink="/signup">Sign up as patient</a></p>
    </div>
  </div>
</div>
